version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juicios_app
    restart: always
    ports:
      - "${PORT:-80}:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-secret_password}
      DB_NAME: ${DB_NAME:-juicios_evaluativos}
    volumes:
      - uploads_data:/var/www/html/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: juicios_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret_password}
      MYSQL_DATABASE: ${DB_NAME:-juicios_evaluativos}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: juicios_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret_password}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      - db

volumes:
  db_data:
  uploads_data:
